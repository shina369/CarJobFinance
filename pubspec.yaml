name: carjobfinance
description: "App para gerenciamento financeiro de motoristas de aplicativo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Dependency Injection
  get_it: ^7.7.0

  # Database (Drift + SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0
  flutter_svg: ^2.0.0
  share_plus: ^13.3.1
  pdf: ^3.13.1
  file_picker: ^13.3.3
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
  supabase: ^2.16.5
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  country_flags: ^4.1.2

# The upstream Windows notifications plugin compiles C++ that needs the
# Visual Studio ATL component. The app only schedules notifications on
# Android/iOS/macOS, so a copy without the native part is used instead.
dependency_overrides:
  flutter_local_notifications_windows:
    path: third_party/flutter_local_notifications_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  drift_dev: ^2.18.0

  # Testing
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    # Supabase URL and publishable key; copy .env.example to .env
    - .env